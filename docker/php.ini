; Límites de subida -- sin este archivo la imagen oficial de PHP usa sus
; defaults (upload_max_filesize=2M, post_max_size=8M): un CSV de AppsFlyer
; de un mes completo pasa de 2 MB y PHP lo descartaba en silencio
; ("The archive failed to upload.", caso real Perú 2026-10-06; México pesa
; ~4.2 MB). 30 MB deja margen y queda debajo del tope fijo de 32 MiB por
; request de Cloud Run -- más arriba fallaría igual, en el borde. Alineado
; con client_max_body_size de docker/nginx.conf y con la validación de
; ImportarDatosController::previsualizar (max 30 MB).
upload_max_filesize = 30M
post_max_size = 31M
